spring:
  application:
    name: pizzachaongon

  # ===== DATABASE =====
  datasource:
    url: jdbc:mysql://localhost:3306/pizzachaongon?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ===== JWT (RSA key pair) =====
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: self

# ===== APP CONFIG =====
app:
  jwt:
    secret-key: pizzachaongon-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

  default-owner:
    username: admin
    password: admin123
    full-name: Chủ cửa hàng

server:
  port: 8080
